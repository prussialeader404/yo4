<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Online Konuşma Sitesi</title>
<style>
  body {
    background-color: white;
    font-family: Arial, sans-serif;
  }
  #register {
    margin: 20px;
  }
  #servers {
    display: flex;
    justify-content: space-around;
    margin: 20px;
  }
  .server {
    background-color: #f0f0f0;
    padding: 10px;
    width: 150px;
    height: 200px;
    text-align: center;
  }
  #feed {
    margin: 20px;
  }
  .post {
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
  }
  .profile {
    display: none;
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px;
  }
  #messages {
    display: none;
    border: 1px solid #ccc;
    padding: 10px;
  }
</style>
</head>
<body>

<h2>Kayıt Ol</h2>
<div id="register">
  <input type="text" id="name" placeholder="İsim" />
  <input type="password" id="password" placeholder="Şifre" />
  <button onclick="register()">Kayıt Ol</button>
</div>

<h2>Giriş Yap</h2>
<div id="login">
  <input type="text" id="loginName" placeholder="İsim" />
  <input type="password" id="loginPassword" placeholder="Şifre" />
  <button onclick="login()">Giriş Yap</button>
</div>

<div id="content" style="display:none;">
  <div id="servers">
    <div class="server">Server1</div>
    <div class="server">Server2</div>
    <div class="server">Server3</div>
  </div>

  <h3>Paylaşımlar</h3>
  <div>
    <textarea id="newPostText" rows="3" cols="50" placeholder="Yazı veya fotoğraf linki..."></textarea><br/>
    <button onclick="addPost()">Gönderi Paylaş</button>
  </div>
  <div id="feed"></div>

  <div class="profile" id="profile">
    <h3>Profil: <span id="profileName"></span></h3>
    <p>Hakkında: <span id="profileBio"></span></p>
    <p>Takipçiler: <span id="followersCount"></span></p>
    <p>Takip Ettikleri: <span id="followingCount"></span></p>
    <button onclick="showMessageBox()">Mesaj At</button>
    <div id="messages"></div>
    <button onclick="closeProfile()">Kapat</button>
  </div>
</div>

<script>
  let users = [];
  let currentUser = null;
  let selectedProfile = null;

  function register() {
    const name = document.getElementById('name').value;
    const password = document.getElementById('password').value;
    if(name && password) {
      if(users.find(u => u.name === name)){
        alert('İsim zaten kullanımda!');
        return;
      }
      const newUser = {
        name,
        password,
        bio: "Hakkında bilgisi yok.",
        followers: [],
        following: [],
        posts: [],
        messages: []
      };
      users.push(newUser);
      alert('Kayıt başarılı! Giriş yapabilirsiniz.');
    } else {
      alert('Lütfen tüm alanları doldurun.');
    }
  }

  function login() {
    const name = document.getElementById('loginName').value;
    const password = document.getElementById('loginPassword').value;
    const user = users.find(u => u.name === name && u.password === password);
    if(user){
      currentUser = user;
      document.getElementById('register').style.display = 'none';
      document.getElementById('login').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      loadFeed();
    }else{
      alert('Kullanıcı bulunamadı veya şifre hatalı.');
    }
  }

  function addPost() {
    const text = document.getElementById('newPostText').value;
    if(text && currentUser){
      const post = {
        author: currentUser.name,
        content: text,
        id: Date.now()
      };
      currentUser.posts.push(post);
      loadFeed();
      document.getElementById('newPostText').value = '';
    }
  }

  function loadFeed() {
    const feedDiv = document.getElementById('feed');
    feedDiv.innerHTML = '';
    users.forEach(user => {
      user.posts.forEach(post => {
        const postDiv = document.createElement('div');
        postDiv.className = 'post';
        postDiv.innerHTML = `<strong style="cursor:pointer;" onclick="viewProfile('${user.name}')">${post.author}</strong>: ${post.content}`;
        feedDiv.appendChild(postDiv);
      });
    });
  }

  function viewProfile(name) {
    const user = users.find(u => u.name === name);
    if(user){
      selectedProfile = user;
      document.getElementById('profileName').innerText = user.name;
      document.getElementById('profileBio').innerText = user.bio;
      document.getElementById('followersCount').innerText = user.followers.length;
      document.getElementById('followingCount').innerText = user.following.length;
      document.getElementById('profile').style.display = 'block';
    }
  }

  function showMessageBox() {
    const messageDiv = document.getElementById('messages');
    messageDiv.innerHTML = `
      <h4>Mesaj Gönder: ${selectedProfile.name}</h4>
      <textarea id="messageText" rows="3" cols="50"></textarea><br/>
      <button onclick="sendMessage()">Gönder</button>
    `;
    messageDiv.style.display = 'block';
  }

  function sendMessage() {
    const messageText = document.getElementById('messageText').value;
    if(messageText && selectedProfile){
      selectedProfile.messages.push({from: currentUser.name, text: messageText});
      alert('Mesaj gönderildi!');
      document.getElementById('messages').style.display = 'none';
    }
  }

  function closeProfile() {
    document.getElementById('profile').style.display = 'none';
  }
</script>

</body>
</html>
